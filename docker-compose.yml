name: covenantiq

x-backend-env: &backend-env
  CIQ_ENV: ${CIQ_ENV:-dev}
  CIQ_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ciq}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-covenantiq}
  CIQ_CHECKPOINT_DB_URL: postgresql://${POSTGRES_USER:-ciq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-covenantiq}
  CIQ_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  CIQ_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
  CIQ_RABBITMQ_URL: amqp://${RABBITMQ_USER:-ciq}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/covenantiq
  CIQ_JWT_SECRET: ${CIQ_JWT_SECRET:?set CIQ_JWT_SECRET in .env}
  CIQ_OFFLINE: ${CIQ_OFFLINE:-0}
  CIQ_LLM_PROVIDER: ${CIQ_LLM_PROVIDER:-anthropic}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CIQ_EMBEDDING_PROVIDER: ${CIQ_EMBEDDING_PROVIDER:-voyage}
  CIQ_EMBEDDING_MODEL: ${CIQ_EMBEDDING_MODEL:-voyage-law-2}
  CIQ_EMBEDDING_DIM: ${CIQ_EMBEDDING_DIM:-1024}
  CIQ_OPENAI_COMPAT_BASE_URL: ${CIQ_OPENAI_COMPAT_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CIQ_RERANK_PROVIDER: ${CIQ_RERANK_PROVIDER:-voyage}
  CIQ_RERANK_MODEL: ${CIQ_RERANK_MODEL:-rerank-2.5}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  CIQ_RERANK_URL: ${CIQ_RERANK_URL:-http://reranker:8100}
  CIQ_RERANK_TIMEOUT_SECONDS: ${CIQ_RERANK_TIMEOUT_SECONDS:-3}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  CIQ_UPLOAD_DIR: /data/uploads
  CIQ_SWEEP_INTERVAL_SECONDS: ${CIQ_SWEEP_INTERVAL_SECONDS:-60}
  CIQ_LOG_FORMAT: json

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ciq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-covenantiq}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100",
              "-c", "maintenance_work_mem=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ciq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: covenantiq
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-covenantiq.conf:ro
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  migrate:
    build: {context: ., dockerfile: docker/backend.Dockerfile, target: runtime}
    image: ${CIQ_IMAGE_BACKEND:-covenantiq-backend:local}
    command: ["covenantiq", "migrate"]          # alembic upgrade head (checkpointer setup joins in M11)
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    networks: [backend]

  api:
    image: ${CIQ_IMAGE_BACKEND:-covenantiq-backend:local}
    command: ["uvicorn", "covenantiq.api.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "${CIQ_API_WORKERS:-2}", "--proxy-headers", "--timeout-graceful-shutdown", "25"]
    environment: *backend-env
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/ready',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [backend, frontend]

  worker-ingest:
    image: ${CIQ_IMAGE_BACKEND:-covenantiq-backend:local}
    command: ["celery", "-A", "covenantiq.workers.celery_app", "worker",
              "-Q", "document_processing,embedding_generation", "-n", "ingest@%h",
              "--concurrency", "${CIQ_INGEST_CONCURRENCY:-2}", "--loglevel", "INFO",
              "--max-tasks-per-child", "25"]
    environment:
      <<: *backend-env
      OMP_NUM_THREADS: "2"
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A covenantiq.workers.celery_app inspect ping -d ingest@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s   # each child loads the Docling models at start-up
    stop_grace_period: 120s                      # let running tasks finish (acks_late covers the rest)
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 6g}
    networks: [backend]

  worker-analysis:
    image: ${CIQ_IMAGE_BACKEND:-covenantiq-backend:local}
    command: ["celery", "-A", "covenantiq.workers.celery_app", "worker",
              "-Q", "contract_analysis,vendor_analysis", "-n", "analysis@%h",
              "--concurrency", "${CIQ_ANALYSIS_CONCURRENCY:-4}", "--loglevel", "INFO"]
    environment: *backend-env
    volumes: [uploads:/data/uploads:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A covenantiq.workers.celery_app inspect ping -d analysis@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [backend]

  # The reranker runs as its own process and container: the cross-encoder is CPU-heavy, so it has
  # its own CPU and memory limit and never shares the API's or a worker's process. The API and the
  # workers call it over HTTP and keep the fused order if it is down or slow, so nothing depends_on
  # it. Used when CIQ_RERANK_PROVIDER=cross_encoder. Behind a profile so the default stack stays
  # within the 8 GB laptop budget: start it with `docker compose --profile rerank up -d`.
  # CPU: CIQ_RERANK_CPUS caps the container (Docker's CFS quota) and CIQ_RERANK_THREADS is how many
  # threads PyTorch uses; keep them equal. Measured on a 16-CPU host: 4 -> 20.8 s for 30 passages,
  # 8 -> 11.9 s, 12 -> 10.2 s, 16 -> 19.7 s (all cores oversubscribe the machine). 8 is the default.
  reranker:
    profiles: [rerank]
    build: {context: ., dockerfile: docker/backend.Dockerfile, target: reranker}
    image: ${CIQ_IMAGE_RERANKER:-covenantiq-reranker:local}
    command: ["covenantiq", "rerank-serve"]
    environment:
      CIQ_RERANK_MODEL: cross-encoder/ettin-reranker-150m-v1   # the model baked into this image
      CIQ_RERANK_THREADS: ${CIQ_RERANK_THREADS:-8}
      CIQ_RERANK_MAX_TOKENS: ${CIQ_RERANK_MAX_TOKENS:-512}
      CIQ_RERANK_BATCH_SIZE: ${CIQ_RERANK_BATCH_SIZE:-4}
      OMP_NUM_THREADS: ${CIQ_RERANK_THREADS:-8}
      CIQ_LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health/ready',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s    # loading the model
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "${CIQ_RERANK_CPUS:-8}", memory: 2g}
    networks: [backend]

  streamlit:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    image: ${CIQ_IMAGE_FRONTEND:-covenantiq-frontend:local}
    environment:
      CIQ_API_BASE_URL: http://api:8000/api/v1
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [frontend]

volumes:
  pgdata: {}
  redisdata: {}
  rabbitdata: {}
  uploads: {}

networks:
  backend: {internal: false}     # set internal: true in prod if workers need no egress (they do: LLM APIs)
  frontend: {}
