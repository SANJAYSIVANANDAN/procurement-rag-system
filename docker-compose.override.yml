# Development overrides, loaded automatically by `docker compose up`.
# CIQ_OFFLINE=1 (passed through the base file) switches every provider to its fake.

services:
  postgres:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]

  rabbitmq:
    ports: ["5672:5672", "15672:15672"]

  api:
    command: ["uvicorn", "covenantiq.api.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/src"]
    volumes:
      - ./src:/app/src
    ports: ["8000:8000"]

  worker-ingest:
    volumes:
      - ./src:/app/src

  worker-analysis:
    volumes:
      - ./src:/app/src

  streamlit:
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501",
              "--server.address", "0.0.0.0", "--server.runOnSave", "true"]
    volumes:
      - ./frontend:/app/frontend
