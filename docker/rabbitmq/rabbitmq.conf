# Late-acked tasks hold their delivery until they finish; long Docling runs must not hit the
# default 30 min timeout. 2 hours in milliseconds.
consumer_timeout = 7200000

vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# The vhost and user come from RABBITMQ_DEFAULT_VHOST / _USER / _PASS (so the password stays in
# the environment). Do not add `load_definitions`: it replaces that bootstrap, and a definitions
# file cannot read the password, which leaves a broker with no user at all.
