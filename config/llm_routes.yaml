# Which model, how much thinking, and what budgets each kind of model call gets (spec 19.15).
#
# A route with no `model` uses CIQ_LLM_MODEL_DEFAULT. Point any route at a cheaper or faster model
# here with no code change, then measure the quality impact (milestone 14) before keeping it.
# `effort` is the model's thinking depth (low | medium | high | xhigh | max). There is no
# temperature: current models do not accept it.
version: 1

routes:
  classify:          {effort: low,    max_tokens: 256,  timeout_s: 4}
  rewrite:           {effort: low,    max_tokens: 256,  timeout_s: 4}
  answer:            {effort: medium, max_tokens: 2048, timeout_s: 60}   # streamed
  rule_assessment:   {effort: medium, max_tokens: 4096, timeout_s: 90}
  signal_extraction: {effort: medium, max_tokens: 4096, timeout_s: 90}
  explain:           {effort: medium, max_tokens: 2048, timeout_s: 60}
  narrative:         {effort: medium, max_tokens: 2048, timeout_s: 60}
  summarize:         {effort: low,    max_tokens: 512,  timeout_s: 20}
  eval_judge:        {effort: medium, max_tokens: 2048, timeout_s: 60}
