# Deterministic clause taxonomy (spec 18.6 step 2).
#
# Each type lists phrases matched, case-insensitively and on word boundaries, against a clause's
# heading and the first 300 characters of its text. A clause can match several types. Types are
# hints that boost retrieval and let analysis rules find candidate clauses; they never filter,
# so a clause the taxonomy misses is still found by search. The slugs are the `clause_types`
# referenced by the contract rules (config/rules).
version: 1
types:
  limitation_of_liability:
    - limitation of liability
    - limitations of liability
    - limit of liability
    - liability cap
    - aggregate liability
    - total liability
    - maximum liability
