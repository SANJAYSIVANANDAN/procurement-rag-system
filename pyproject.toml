[project]
name = "covenantiq"
version = "0.1.0"
description = "AI contract intelligence and vendor risk analysis platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery[redis]>=5.4",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "pyjwt>=2.9",
    "pypdfium2>=4.30",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-multipart>=0.0.12",
    "pwdlib[argon2]>=0.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
    "docling>=2.0",
    "pyyaml>=6.0.3",
    "voyageai>=0.6.0",
    "httpx>=0.28.1",
    "sentence-transformers>=5.1",
    "rapidfuzz>=3.14.6",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
covenantiq = "covenantiq.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pypdf>=5.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "reportlab>=5.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covenantiq"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"tests/fixtures/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/covenantiq"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "magic", "pypdfium2", "pypdfium2.*", "yaml", "snowballstemmer"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["covenantiq.services.health_service", "covenantiq.workers.*", "covenantiq.services.task_dispatcher", "covenantiq.services.dlq_service"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -m \"not slow\""
markers = ["slow: real Docling conversions (model loading takes minutes); run with -m slow"]

[tool.coverage.run]
source = ["src/covenantiq"]
